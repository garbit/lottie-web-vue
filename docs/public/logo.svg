  <path d="M13 44 A51 51 0 0 0 115 44 Z" fill="#e25852"/>
  <!-- eyes: wide flat cream ovals, large pupils glancing inward -->
  <ellipse cx="46" cy="54" rx="7.5" ry="3.2" fill="#f6ecdb"/>
  <ellipse cx="82" cy="54" rx="7.5" ry="3.2" fill="#f6ecdb"/>
  <circle cx="47.5" cy="54" r="3" fill="#42484b"/>
  <circle cx="80" cy="54" r="3" fill="#42484b"/>
  <!-- open smiling mouth just below the eyes, with tongue -->
  <path d="M55 57.5 Q55 69 64 69 Q73 69 73 57.5 Z" fill="#42484b"/>
  <path d="M58 64.5 A6.5 5 0 0 0 70 64.5 Q64 61.5 58 64.5 Z" fill="#eda08c"/>
