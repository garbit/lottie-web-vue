name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NOTE: no registry-url here — it writes an .npmrc with an (empty)
      # _authToken that shadows OIDC Trusted Publishing and breaks publish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted Publishing needs a recent npm on the runner
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Guard - package.json version must match the pushed tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Full verification (lint, typecheck, unit, build, pack smoke, browser E2E)
        run: |
          npx playwright install --with-deps chromium
          npm run verify

      - name: Publish to npm
        # prerelease tags (v3.0.0-rc.0) go to the 'next' dist-tag, never 'latest'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
